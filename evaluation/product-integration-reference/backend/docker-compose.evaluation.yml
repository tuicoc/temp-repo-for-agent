name: agent-evaluation
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_eval_dev
      POSTGRES_PASSWORD: ${EVALUATION_DB_PASSWORD:?Set a sandbox-only password}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - evaluation_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_eval_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  evaluation_pgdata:
