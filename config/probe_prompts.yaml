# The trial prompts used to compare providers.
#
# Deliberately small and general. They are here to tell fast models from slow
# ones and careless ones from careful ones before any project work depends on
# the choice. They are NOT the project's evaluation set — that belongs with the
# golden scenarios in docs/flow.md section 17.
#
# All four are Vietnamese, because that is the language the product runs in and
# a model that reasons well in English can still be clumsy in Vietnamese.
#
# A prompt with a `schema` names a Pydantic model in src/schemas.py. LangChain
# binds it, the provider returns a validated object, and `expect` says what a
# right answer looks like, so the result is scored rather than eyeballed. The
# field descriptions in that model are part of the prompt: they are what tell
# the model that a name is "Lan" and not "Chị Lan".
#
# It also sidesteps a real problem with free text — Gemini 3.x returns a list
# of content blocks and reasoning models leak their thinking into it, so the
# plain string is not reliably the answer.
#
# A prompt without a schema is judged by reading it. That is the right
# treatment for tone, which has no single correct answer.

prompts:
  - key: reasoning
    probes: Compound arithmetic with a plausible wrong answer
    schema: DiscountJudgement
    system: |
      Bạn là trợ lý tính toán. Trả lời chính xác, không làm tròn ẩu.
      Hai lần giảm giá liên tiếp không cộng dồn trực tiếp với nhau.
    # Two successive discounts of 20% then 10% give 28%, not 30%. A model that
    # pattern-matches on the numbers says 30%.
    text: |
      Một cửa hàng giảm giá 20%, sau đó giảm thêm 10% trên giá đã giảm.
      Khách nói như vậy là được giảm tổng cộng 30%. Khách nói đúng hay sai?
    expect:
      khach_noi_dung: false
      muc_giam_thuc_te_phan_tram: 28

  - key: extraction
    probes: Pulling structured fields out of a Vietnamese sentence
    schema: OrderExtraction
    system: |
      Bạn là trợ lý trích xuất thông tin đơn hàng từ tiếng Việt.
      Chỉ dùng thông tin có trong câu, không suy đoán thêm.
    text: |
      Trích thông tin từ câu sau:
      "Chị Lan ở Đà Nẵng đặt 2 cái áo size M màu xanh, tổng 350 nghìn."
    expect:
      ten_khach: Lan
      thanh_pho: Đà Nẵng
      so_luong: 2
      size: M
      tong_tien_vnd: 350000

  - key: vietnamese
    probes: Natural Vietnamese register and politeness, judged by reading
    text: |
      Viết lại câu sau cho tự nhiên và lịch sự theo văn phong nhân viên bán
      hàng người Việt, giữ nguyên ý, chỉ trả về câu đã viết lại:
      "Sản phẩm này hết hàng rồi, anh đợi đi."

  - key: instruction
    probes: Obeying hard constraints instead of padding, judged by reading
    text: |
      Nêu ba lợi ích của việc ngủ đủ giấc.
      Ràng buộc: đúng 3 gạch đầu dòng, mỗi dòng tối đa 8 từ,
      không có câu mở đầu, không có câu kết luận.
