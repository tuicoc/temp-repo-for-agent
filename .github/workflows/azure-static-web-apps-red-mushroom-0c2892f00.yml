name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    # The API deploys on its own, so a backend-only change should not rebuild
    # and redeploy the browser app.
    paths:
      - 'frontend/**'
      - '.github/workflows/azure-static-web-apps-red-mushroom-0c2892f00.yml' 
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    environment:
      name: production-web
      url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          # Vite inlines VITE_* variables into the bundle at build time, and the
          # build happens here. Static Web Apps' own Application settings are
          # runtime settings for its Functions API, so setting it there does
          # nothing — the files are already built by then.
          #
          # Not a secret: anything inlined into the bundle is readable by anyone
          # who opens the page. It is kept in the workflow so the value is
          # visible and versioned rather than hidden in a settings panel.
          #
          # This must match CORS_ORIGINS on the App Service, from the other
          # direction: the page names the API here, the API names the page there.
          VITE_API_BASE_URL: https://sudo-code-eybfa8cubpazf9hc.japaneast-01.azurewebsites.net
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_MUSHROOM_0C2892F00 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # The browser app lives in frontend/, and Vite writes to dist/ —
          # "build" is Create React App's default, not Vite's. Left as
          # generated, the deploy uploads nothing.
          app_location: "frontend"
          # The API is a separate App Service, not a Static Web Apps function.
          api_location: ""
          output_location: "dist"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
